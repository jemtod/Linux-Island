name: Tes logic inti

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.11', '3.12']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-core.txt
            requirements-dev.txt
      # GTK/pydbus tidak diperlukan oleh unit test headless.
      - name: Pasang dependensi logic dan test
        run: python -m pip install -r requirements-core.txt -r requirements-dev.txt
      - name: Selftest tanpa site-packages atau display
        run: python -S -O island.py --selftest
      - name: Pytest headless
        run: python -m pytest -q
